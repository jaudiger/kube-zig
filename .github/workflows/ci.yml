name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      zig: ${{ steps.filter.outputs.zig }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect changed paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            zig:
              - '**/*.zig'
              - 'build.zig.zon'
              - 'test/fixtures/**'
              - '.github/workflows/ci.yml'
            workflows:
              - '.github/workflows/**'

  build-zig:
    needs: changes
    if: needs.changes.outputs.zig == 'true'
    uses: jaudiger/reusable-workflows/.github/workflows/build-zig.yml@0fdb4286768192eacc11e2a71d0ef74fcd1c3195
    with:
      zig-version: "0.16.0"

  lint-zig:
    needs: changes
    if: needs.changes.outputs.zig == 'true'
    uses: jaudiger/reusable-workflows/.github/workflows/static-analysis-zig.yml@0fdb4286768192eacc11e2a71d0ef74fcd1c3195
    with:
      zig-version: "0.16.0"

  test-zig:
    needs: changes
    if: needs.changes.outputs.zig == 'true'
    uses: jaudiger/reusable-workflows/.github/workflows/tests-zig.yml@0fdb4286768192eacc11e2a71d0ef74fcd1c3195
    with:
      zig-version: "0.16.0"

  lint-actions:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    uses: jaudiger/reusable-workflows/.github/workflows/static-analysis-github-actions.yml@0fdb4286768192eacc11e2a71d0ef74fcd1c3195

  ci:
    if: always()
    needs: [build-zig, lint-zig, test-zig, lint-actions]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required checks passed
        env:
          RESULTS: ${{ toJson(needs.*.result) }}
        run: |
          echo "Job results: $RESULTS"
          if echo "$RESULTS" | grep -qE '"(failure|cancelled)"'; then
            echo "One or more required checks failed"
            exit 1
          fi
