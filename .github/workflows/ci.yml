name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      zig: ${{ steps.filter.outputs.zig }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Detect changed paths
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            zig:
              - '**/*.zig'
              - 'build.zig.zon'
              - 'test/fixtures/**'
              - '.github/workflows/ci.yml'
            workflows:
              - '.github/workflows/**'

  build-zig:
    needs: changes
    if: needs.changes.outputs.zig == 'true'
    uses: jaudiger/reusable-workflows/.github/workflows/build-zig.yml@8104be620dc861697cf02b53d8fe3119edece0b5
    with:
      zig-version: "0.16.0"

  lint-zig:
    needs: changes
    if: needs.changes.outputs.zig == 'true'
    uses: jaudiger/reusable-workflows/.github/workflows/static-analysis-zig.yml@8104be620dc861697cf02b53d8fe3119edece0b5
    with:
      zig-version: "0.16.0"

  test-zig:
    needs: changes
    if: needs.changes.outputs.zig == 'true'
    uses: jaudiger/reusable-workflows/.github/workflows/tests-zig.yml@8104be620dc861697cf02b53d8fe3119edece0b5
    with:
      zig-version: "0.16.0"

  lint-actions:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    uses: jaudiger/reusable-workflows/.github/workflows/static-analysis-github-actions.yml@8104be620dc861697cf02b53d8fe3119edece0b5

  ci:
    if: always()
    needs: [build-zig, lint-zig, test-zig, lint-actions]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required checks passed
        env:
          RESULTS: ${{ toJson(needs.*.result) }}
        run: |
          echo "Job results: $RESULTS"
          if echo "$RESULTS" | grep -qE '"(failure|cancelled)"'; then
            echo "One or more required checks failed"
            exit 1
          fi
